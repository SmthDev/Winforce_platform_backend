services:
  postgres:
    image: postgres:17-alpine
    container_name: winforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-winforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winforce}
      POSTGRES_DB: ${POSTGRES_DB:-winforce}

    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-winforce} -d ${POSTGRES_DB:-winforce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: winforce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-winforce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-winforce}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
  miniodata:
