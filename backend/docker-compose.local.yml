services:
  postgres:
    image: postgres:17-alpine
    container_name: winforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-winforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winforce}
      POSTGRES_DB: ${POSTGRES_DB:-winforce}
      
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-winforce} -d ${POSTGRES_DB:-winforce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.4
    container_name: winforce-loki
    restart: unless-stopped
  
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - lokidata:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winforce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: winforce-alloy
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: winforce-grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:

      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  lokidata:
  grafanadata:
