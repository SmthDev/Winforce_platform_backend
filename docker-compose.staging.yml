services:
  postgres:
    image: postgres:17-alpine
    container_name: winforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: winforce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


  createbuckets:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: winforce-createbuckets
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/avatars local/qr-codes local/receipts
      "

  migrate:
    image: ghcr.io/smthdev/winforce-backend:latest
    container_name: winforce-migrate
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  backend:
    image: ghcr.io/smthdev/winforce-backend:latest
    container_name: winforce-backend
    restart: unless-stopped

    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:${PORT:-8080}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  miniodata:
