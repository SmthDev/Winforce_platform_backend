<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winforce - API Documentation</title>
    <style>
        body { margin: 0; padding: 0; }
        #opencollection-container { width: 100vw; height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://cdn.opencollection.com/docs.css">
    <script src="https://cdn.opencollection.com/docs.js"></script>
</head>
<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: winforce\nconfig:\n  environments:\n    - name: winforce-api\n      variables:\n        - name: stage_url\n          value: https://winforce-platform.onrender.com/api/v1\n        - name: origin\n          value: http://localhost:5173\nitems:\n  - info:\n      name: health\n      type: http\n      seq: 1\n\n    http:\n      method: GET\n      url: https://winforce-platform.onrender.com/api/v1/health\n      auth: inherit\n\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: signup\n      type: http\n      seq: 2\n\n    http:\n      method: POST\n      url: '{{stage_url}}/auth/signup/credential'\n      auth: inherit\n      headers:\n        - name: Content-Type\n          value: application/json\n        - name: Origin\n          value: '{{origin}}'\n      body:\n        type: json\n        data: |-\n          {\n            \"email\": \"user@example.com\",\n            \"password\": \"Passw0rd!\"\n          }\n\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: signin\n      type: http\n      seq: 3\n\n    http:\n      method: POST\n      url: '{{stage_url}}/auth/signin/credential'\n      auth: inherit\n      headers:\n        - name: Content-Type\n          value: application/json\n        - name: Origin\n          value: '{{origin}}'\n      body:\n        type: json\n        data: |-\n          {\n            \"credential\": \"user@example.com\",\n            \"password\": \"Passw0rd!\",\n            \"remember_me\": true\n          }\n\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: me\n      type: http\n      seq: 4\n\n    http:\n      method: GET\n      url: '{{stage_url}}/auth/me'\n      auth: inherit\n      headers:\n        - name: Origin\n          value: '{{origin}}'\n\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: signout\n      type: http\n      seq: 5\n\n    http:\n      method: POST\n      url: '{{stage_url}}/auth/signout'\n      auth: inherit\n      headers:\n        - name: Content-Type\n          value: application/json\n        - name: Origin\n          value: '{{origin}}'\n\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light',
            gitCollectionUrl: "https://github.com/saneechka/Winforce_platform.git"
        });
    </script>
</body>
</html>
