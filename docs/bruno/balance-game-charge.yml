info:
  name: balance-game-charge
  type: http
  seq: 21

http:
  method: POST
  url: "{{host}}/balance/game-charge"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "user_ids": [1, 2, 3],
        "amount_minor": 10000,
        "currency": "BYN",
        "comment": "test_game"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
