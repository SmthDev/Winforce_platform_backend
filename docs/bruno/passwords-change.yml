      value: application/json
    - name: Origin
      value: '{{origin}}'
  body:
    type: json
    data: |-
      {
        "current_password": "Passw0rd!",
        "new_password": "NewPassw0rd!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
